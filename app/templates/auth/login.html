{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="w-full max-w-md">

        <!-- Card de Login -->
        <div class="rounded-2xl p-8 shadow-2xl"
             style="background-color: var(--color-surface); border: 1px solid var(--color-border);">

            <!-- Cabeçalho -->
            <div class="text-center mb-8">
                <img src="{{ url_for('static', filename='img/logo_mi7.png') }}"
                     alt="Mi7"
                     class="h-12 w-auto mx-auto mb-4"
                     onerror="this.style.display='none'">
                <h1 class="text-2xl font-bold tracking-tight" style="color: var(--color-text-primary);">
                    Painel de Inteligência
                </h1>
                <p class="text-sm mt-1" style="color: var(--color-text-secondary);">
                    Acesso restrito ao time Mi7
                </p>
            </div>

            <!-- Formulário -->
            <form method="POST" action="{{ url_for('auth.login') }}"
                  x-data="{ loading: false }"
                  @submit="loading = true">

                <!-- Campo E-mail -->
                <div class="mb-4">
                    <label for="email" class="block text-sm font-medium mb-2"
                           style="color: var(--color-text-secondary);">
                        E-mail corporativo
                    </label>
                    <input type="email"
                           id="email"
                           name="email"
                           required
                           autocomplete="email"
                           class="w-full px-4 py-3 rounded-xl text-sm outline-none focus:ring-2 transition-all"
                           style="background-color: var(--color-surface-2);
                                  border: 1px solid var(--color-border);
                                  color: var(--color-text-primary);
                                  --tw-ring-color: var(--color-accent);"
                           placeholder="seuemail@grupoint.com.br">
                </div>

                <!-- Campo Senha -->
                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium mb-2"
                           style="color: var(--color-text-secondary);">
                        Senha
                    </label>
                    <input type="password"
                           id="password"
                           name="password"
                           required
                           autocomplete="current-password"
                           class="w-full px-4 py-3 rounded-xl text-sm outline-none focus:ring-2 transition-all"
                           style="background-color: var(--color-surface-2);
                                  border: 1px solid var(--color-border);
                                  color: var(--color-text-primary);"
                           placeholder="••••••••">
                </div>

                <!-- Botão de Login -->
                <button type="submit"
                        :disabled="loading"
                        class="w-full py-3 px-4 rounded-xl font-semibold text-sm transition-all
                               hover:opacity-90 active:scale-95 disabled:opacity-50"
                        style="background-color: var(--color-accent); color: white;">
                    <span x-show="!loading">Entrar no Sistema</span>
                    <span x-show="loading" class="flex items-center justify-center gap-2">
                        <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                        </svg>
                        Verificando...
                    </span>
                </button>

            </form>
        </div>

        <p class="text-center text-xs mt-6" style="color: var(--color-text-secondary);">
            Acesso validado via Bitrix24 · Mi7 Grupo © {{ 2025 }}
        </p>

    </div>
</div>
{% endblock %}
