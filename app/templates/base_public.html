<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Login{% endblock %} — Mi7 Intelligence</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-page);">

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div style="position:fixed;top:var(--space-5);left:50%;transform:translateX(-50%);width:420px;z-index:100;">
        {% for category, message in messages %}
        <div class="alert alert-{{ 'error' if category == 'error' else ('success' if category == 'success' else 'info') }}">
            <div>{{ message }}</div>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

</div>

<script src="https://unpkg.com/lucide@0.474.0/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>

{% block extra_js %}{% endblock %}
</body>
</html>
