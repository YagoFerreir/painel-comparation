services:
  - type: web
    name: mi7-painel-competitivo
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true  # Render gera automaticamente
      - key: BITRIX24_WEBHOOK_URL
        sync: false  # Será preenchido manualmente no painel do Render
